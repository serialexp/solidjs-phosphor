name: Update and Publish

on:
  schedule:
    # Weekly on Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch: # Allow manual trigger
    inputs:
      force:
        description: Publish even when upstream icons are unchanged (factory, types or packaging changes)
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      # Trusted publishing (OIDC via `id-token: write`) needs npm >= 11.5.1.
      # npm@latest keeps raising its Node floor, so track the latest LTS.
      # See https://docs.npmjs.com/trusted-publishers
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm (trusted publishing support)
        run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - name: Clone phosphor-icons/core
        run: git clone --depth 1 https://github.com/phosphor-icons/core.git phosphor-core

      - name: Generate components
        run: pnpm run generate

      - name: Type-check
        run: pnpm run check

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet src/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version and publish
        if: steps.diff.outputs.changed == 'true' || inputs.force
        # No token: npm authenticates through trusted publishing (OIDC).
        run: |
          # Match upstream major.minor, auto-increment patch
          UPSTREAM_VERSION=$(jq -r .version phosphor-core/package.json)
          UPSTREAM_MAJOR_MINOR=$(echo "$UPSTREAM_VERSION" | cut -d. -f1,2)
          CURRENT_VERSION=$(jq -r .version package.json)
          CURRENT_MAJOR_MINOR=$(echo "$CURRENT_VERSION" | cut -d. -f1,2)
          CURRENT_PATCH=$(echo "$CURRENT_VERSION" | cut -d. -f3)

          if [ "$UPSTREAM_MAJOR_MINOR" != "$CURRENT_MAJOR_MINOR" ]; then
            # Upstream major.minor changed — reset patch to 0
            npm version "${UPSTREAM_MAJOR_MINOR}.0" --no-git-tag-version
          else
            # Same major.minor — bump patch
            npm version "${CURRENT_MAJOR_MINOR}.$((CURRENT_PATCH + 1))" --no-git-tag-version
          fi

          NEW_VERSION=$(jq -r .version package.json)
          echo "Publishing v${NEW_VERSION}"

          # npm itself, not pnpm, so the OIDC exchange is done by an npm CLI
          # known to support it. prepublishOnly still runs generate/check/build.
          npm publish --access public --provenance

          # Commit and tag
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/ package.json
          if [ "${{ steps.diff.outputs.changed }}" = "true" ]; then
            git commit -m "chore: update icons to v${NEW_VERSION}"
          else
            git commit -m "chore: release v${NEW_VERSION}"
          fi
          git tag "v${NEW_VERSION}"
          git push
          git push --tags
